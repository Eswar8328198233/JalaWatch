        <h1 style="color: #0f766e; font-size: 26px; margin-bottom: 8px;">JalaWatch – Groundwater Pollution Reporting &amp; Water Quality Portal</h1>
        <p style="font-size: 14px; color: #64748b; margin-top: 0;">Community Service Project (CSP) 2026 • Nutakki Village, Guntur District, Andhra Pradesh, India</p>
        
        <p>
          <strong>JalaWatch</strong> is an open community environmental platform designed to facilitate groundwater pollution reporting, community water observation, and public health awareness for <strong>Nutakki Village</strong> and neighboring rural areas across <strong>Andhra Pradesh</strong>.
        </p>

        <h2 style="color: #0f766e; font-size: 18px; margin-top: 24px;">Groundwater Pollution &amp; Water Quality Capabilities</h2>
        <ul>
          <li><strong>Groundwater Pollution Reporting:</strong> Report unusual water color, pungent smells, chemical taste, industrial effluent dumping, domestic drainage pooling, and agricultural fertilizer seepage.</li>
          <li><strong>Interactive Contamination Map:</strong> Review geospatial pollution clusters, borewell observation sites, and vulnerability zones along the Krishna River catchment.</li>
          <li><strong>Certified Water Quality Testing:</strong> Track laboratory test parameters including pH, Total Dissolved Solids (TDS), Fluoride, Nitrate, and microbial presence (E. coli) compared against Indian Standard BIS IS 10500.</li>
          <li><strong>Public Health Awareness:</strong> Access official testing lab contacts (RWS&amp;S District Water Testing Lab, Guntur) and guidelines on preventing waterborne illnesses.</li>
        </ul>
